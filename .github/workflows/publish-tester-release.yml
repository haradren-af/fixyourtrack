name: Publish tester release

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/release'
    runs-on: windows-latest

    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read and validate version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^0\.\d+\.\d+$') {
            throw "Expected a 0.x.y tester version, found '$version'."
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Reject an already published version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:RELEASE_TAG already exists. Bump package.json before updating the release branch."
          }
          exit 0

      - name: Check source
        run: npm run lint

      - name: Build Windows tester package
        run: npm run package:windows

      - name: Build macOS tester package
        run: npm run package:macos

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash release/FixYourTrack-Tester-Windows.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  FixYourTrack-Tester-Windows.zip" } |
            Set-Content release/SHA256SUMS.txt -Encoding ASCII
          Get-FileHash release/FixYourTrack-Tester-macOS.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  FixYourTrack-Tester-macOS.zip" } |
            Add-Content release/SHA256SUMS.txt -Encoding ASCII

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "FixYourTrack $env:RELEASE_VERSION" `
            --notes-file RELEASE_NOTES.md `
            --latest `
            release/FixYourTrack-Tester-Windows.zip `
            release/FixYourTrack-Tester-macOS.zip `
            release/SHA256SUMS.txt
