name: Publish tester release

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tester-release
  cancel-in-progress: false

jobs:
  build_release_assets:
    name: Build and verify release assets
    if: github.ref == 'refs/heads/release'
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release_metadata.outputs.version }}
      tag: ${{ steps.release_metadata.outputs.tag }}
      prerelease: ${{ steps.release_metadata.outputs.prerelease }}

    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Go for server tests and macOS cross-compilation
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.26.4
          cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Read and validate release version
        id: release_metadata
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $semver = '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$'
          if ($version -notmatch $semver) {
            throw "Expected a valid SemVer package version, found '$version'."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check generated supply-chain artifacts
        run: npm run supply-chain:check

      - name: Lint source
        run: npm run lint

      - name: Check patch whitespace
        run: git diff --check

      - name: Run unit tests
        run: npm test

      - name: Test Go package tools
        run: go test ./packaging/macos/server ./packaging/macos/zip

      - name: Test Windows package server
        run: npm run test:server:windows

      - name: Test development startup
        run: npm run test:dev:start

      - name: Build application
        run: npm run build

      - name: Enforce bundle budgets
        run: node scripts/Check-Bundle-Budget.mjs

      - name: Test browser workflow
        run: node scripts/Browser-Smoke-Test.mjs

      - name: Build Windows tester package
        run: npm run package:windows

      - name: Build macOS tester package
        run: npm run package:macos

      - name: Assemble and verify release assets
        shell: pwsh
        run: ./scripts/New-Release-Assets.ps1

      - name: Upload verified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ steps.release_metadata.outputs.version }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            release/FixYourTrack-Tester-Windows.zip
            release/FixYourTrack-Tester-macOS.zip
            release/THIRD_PARTY_NOTICES.txt
            release/SBOM.cdx.json
            release/SHA256SUMS.txt
            release/RELEASE_NOTES.md

  publish_release:
    name: Publish verified draft
    needs: build_release_assets
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out verification script
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download verified release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ needs.build_release_assets.outputs.version }}
          path: staged-release

      - name: Re-verify staged assets
        shell: pwsh
        run: ./scripts/Test-Release-Assets.ps1 -ReleaseDirectory staged-release

      - name: Inspect existing release state
        id: release_state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build_release_assets.outputs.tag }}
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "User-Agent" = "FixYourTrack-release-workflow"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $escapedTag = [System.Uri]::EscapeDataString($env:RELEASE_TAG)
          $releaseUri = "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/releases/tags/$escapedTag"
          $existingRelease = $null
          try {
            $existingRelease = Invoke-RestMethod -Method Get -Uri $releaseUri -Headers $headers
          }
          catch {
            $statusCode = if ($_.Exception.Response) {
              [int]$_.Exception.Response.StatusCode
            }
            else {
              0
            }
            if ($statusCode -ne 404) {
              throw "Could not inspect release $env:RELEASE_TAG (HTTP $statusCode)."
            }
          }

          if (-not $existingRelease) {
            "reuse=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "No existing release uses $env:RELEASE_TAG; a new draft will be created."
            exit 0
          }
          if (-not [bool]$existingRelease.draft) {
            throw "Release $env:RELEASE_TAG is already published. Bump package.json before publishing again."
          }
          if (-not [string]::Equals(
            ([string]$existingRelease.target_commitish).Trim(),
            $env:GITHUB_SHA,
            [System.StringComparison]::OrdinalIgnoreCase
          )) {
            throw "Draft release $env:RELEASE_TAG targets '$($existingRelease.target_commitish)', not this commit $env:GITHUB_SHA."
          }

          "reuse=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Reusing unpublished draft $env:RELEASE_TAG for commit $env:GITHUB_SHA."

      - name: Prepare draft release and upload assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build_release_assets.outputs.version }}
          RELEASE_TAG: ${{ needs.build_release_assets.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.build_release_assets.outputs.prerelease }}
          REUSE_RELEASE_DRAFT: ${{ steps.release_state.outputs.reuse }}
        run: |
          if ($env:REUSE_RELEASE_DRAFT -eq "true") {
            $releaseStateJson = & gh release view $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --json isDraft,targetCommitish | Out-String
            if ($LASTEXITCODE -ne 0) { throw "Failed to re-check the resumable draft release." }
            $releaseState = $releaseStateJson | ConvertFrom-Json
            if (-not [bool]$releaseState.isDraft) {
              throw "Release $env:RELEASE_TAG is no longer an unpublished draft."
            }
            if (-not [string]::Equals(
              ([string]$releaseState.targetCommitish).Trim(),
              $env:GITHUB_SHA,
              [System.StringComparison]::OrdinalIgnoreCase
            )) {
              throw "Draft release $env:RELEASE_TAG no longer targets this commit."
            }

            $editArguments = @(
              "release", "edit", $env:RELEASE_TAG,
              "--repo", $env:GITHUB_REPOSITORY,
              "--target", $env:GITHUB_SHA,
              "--title", "FixYourTrack $env:RELEASE_VERSION",
              "--notes-file", "staged-release/RELEASE_NOTES.md",
              "--draft=true",
              "--prerelease=$env:RELEASE_PRERELEASE"
            )
            & gh @editArguments
            if ($LASTEXITCODE -ne 0) { throw "Failed to refresh the resumable draft release metadata." }
          }
          else {
            $createArguments = @(
              "release", "create", $env:RELEASE_TAG,
              "--repo", $env:GITHUB_REPOSITORY,
              "--target", $env:GITHUB_SHA,
              "--title", "FixYourTrack $env:RELEASE_VERSION",
              "--notes-file", "staged-release/RELEASE_NOTES.md",
              "--draft"
            )
            if ($env:RELEASE_PRERELEASE -eq "true") {
              $createArguments += "--prerelease"
            }
            & gh @createArguments
            if ($LASTEXITCODE -ne 0) { throw "Failed to create the draft release." }
          }

          $assetPaths = @(
            "staged-release/FixYourTrack-Tester-Windows.zip",
            "staged-release/FixYourTrack-Tester-macOS.zip",
            "staged-release/THIRD_PARTY_NOTICES.txt",
            "staged-release/SBOM.cdx.json",
            "staged-release/SHA256SUMS.txt"
          )
          & gh release upload $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --clobber @assetPaths
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload one or more draft release assets." }

      - name: Download and verify uploaded draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build_release_assets.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Path remote-release -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir remote-release
          if ($LASTEXITCODE -ne 0) { throw "Failed to download draft release assets for verification." }
          ./scripts/Test-Release-Assets.ps1 -ReleaseDirectory remote-release -StrictAssetSet

      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build_release_assets.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.build_release_assets.outputs.prerelease }}
        run: |
          $publishArguments = @(
            "release", "edit", $env:RELEASE_TAG,
            "--repo", $env:GITHUB_REPOSITORY,
            "--draft=false"
          )
          if ($env:RELEASE_PRERELEASE -ne "true") {
            $publishArguments += "--latest"
          }
          & gh @publishArguments
          if ($LASTEXITCODE -ne 0) { throw "Draft release verification passed, but publishing failed." }
